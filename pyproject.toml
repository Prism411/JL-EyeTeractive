[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeteractive"
version = "0.2.0"
description = "Rastreamento ocular assistivo de baixo custo com fusão paraconsistente de CNN e geometria da íris"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jáder Louis de Souza Gonçalves" },
    { name = "Lucas Marques da Cunha" },
]
keywords = ["eye-tracking", "accessibility", "paraconsistent-logic", "assistive-technology"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "mediapipe>=1.0",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
treino = ["scikit-learn>=1.5"]
dev = ["pytest>=8.0", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
